name: bloodflow-hub

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: bloodflow-hub-backend:latest
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - SERVE_STATIC=false
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/bloodflow_hub}
      - APP_URL=${APP_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Staff ID documents must survive container rebuilds
      - uploads:/app/uploads
    ports:
      - "3001:3001"
    networks:
      - bloodflow-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: /api
    image: bloodflow-hub-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - bloodflow-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=bloodflow_hub
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres -d bloodflow_hub
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - bloodflow-network
    restart: unless-stopped

volumes:
  pg_data:
  uploads:

networks:
  bloodflow-network:
    driver: bridge
